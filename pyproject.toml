[project]
name = "pokemon-companion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "platformdirs>=4.11.12",
    "pyqt6>=6.11.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
pokemon-companion = "pokemon_companion.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20260906",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pokemon_companion"]

[tool.mypy]
python_version = "3.12"
packages = ["pokemon_companion"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pokemon_companion"]
