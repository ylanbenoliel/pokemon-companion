# Pesos da função de avaliação heurística usada por MediumAI/HardAI.
# Ajustável sem tocar em código — ver ai/heuristics_medium.py:evaluate_state.
# Chaves ausentes usam DEFAULT_WEIGHTS. Valores calibrados no torneio IA vs IA
# dos 20 decks do meta (tools/tournament.py).

medium: &default
  win: 1000.0
  prizes_taken: 25.0
  board_presence: 5.0
  opponent_hp: 1.0
  own_hp: 0.4
  lose_own_active: 80.0
  energy_attached: 5.0
  hand_size: 2.0
  attack_ready: 12.0
  attack_progress: 20.0
  deck_out: 150.0

# Difícil: dano acumulado (com o HP dos nocauteados) no lugar do HP restante do
# oponente e potencial contra um Ativo sem dano. A/B no espelho dos 65 decks
# (390 partidas, 18/11/2026): 59,5% contra os pesos do médio, e pula menos
# ataques (30 × 79). `win` alto: a soma do dano passava de 1000 e a IA chegava
# a recusar o ataque que vencia a partida. No médio (guloso) não houve ganho.
hard:
  <<: *default
  win: 100000.0
  damage_dealt: 1.0
  opponent_hp: 0.0
  potential_vs_fresh: 1.0
